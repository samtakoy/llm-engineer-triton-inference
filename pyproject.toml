[project]
name = "llm-eng-26-triton"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ipykernel==7.3.0",
    "onnx==1.22.0",
    "onnxruntime>=1.29.0",
    "optimum[exporters]==2.3.0",
    "sentence-transformers==6.0.1",
    "torch==2.14.0",
    "transformers==5.16.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
