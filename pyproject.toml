[project]
name = "llm-eng-26-triton"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.6",
    "transformers==4.51.3",
    "onnx==1.16",
    "onnxruntime==1.20",
    "sentencepiece==0.2",
    "sentence-transformers>=3.0,<5",
    "ipykernel==6.29",
    "tritonclient[grpc]>=2.50",
    "pandas==3.0.5",
    "matplotlib==3.11.1",
    "tabulate==0.10.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
